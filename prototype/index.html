<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾雨原型</title>
<!-- 拾雨界面原型：用模拟数据跑一遍外观和交互，定稿后照此搬到 SwiftUI -->
<style>
  :root {
    --page: #e9e9ed;
    --window: #ffffff;
    --sidebar: #f5f5f7;
    --menu: #ffffff;
    --card: #f6f6f8;
    --text: #1d1d1f;
    --text-2: #6e6e73;
    --text-3: #a1a1a6;
    --line: rgba(0, 0, 0, .07);
    --tree: rgba(0, 0, 0, .16);
    --hover: rgba(0, 0, 0, .05);
    --selected: rgba(0, 0, 0, .07);
    --track: rgba(0, 0, 0, .07);
    --accent: #007aff;
    --on-accent: #ffffff;
    --danger: #ff3b30;
    --seg-bg: rgba(0, 0, 0, .05);
    --seg-on: #ffffff;
    --switch-off: rgba(0, 0, 0, .12);
    --shadow: 0 0 0 .5px rgba(0, 0, 0, .12), 0 20px 60px rgba(0, 0, 0, .18);
    --menu-shadow: 0 0 0 .5px rgba(0, 0, 0, .12), 0 8px 24px rgba(0, 0, 0, .14);
    --c-video: #a463f2; --c-audio: #ff375f; --c-image: #ff9f0a; --c-doc: #007aff;
    --c-archive: #a2845e; --c-installer: #636366; --c-other: #8e8e93;
    --side-w: 210px;
    --ease: cubic-bezier(.3, .7, .2, 1);
    /* 字号系统：所有字号都乘这个倍数 */
    --scale: 1;
    --fs: calc(13px * var(--scale));
    --fs-sm: calc(11.5px * var(--scale));
    --fs-xs: calc(12px * var(--scale));
    --fs-title: calc(15px * var(--scale));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0e0e10;
      --window: #1e1e20;
      --sidebar: #252527;
      --menu: #2c2c2e;
      --card: #2a2a2c;
      --text: #f5f5f7;
      --text-2: #98989d;
      --text-3: #636366;
      --line: rgba(255, 255, 255, .07);
      --tree: rgba(255, 255, 255, .16);
      --hover: rgba(255, 255, 255, .06);
      --selected: rgba(255, 255, 255, .09);
      --track: rgba(255, 255, 255, .09);
      --accent: #0a84ff;
      --danger: #ff453a;
      --seg-bg: rgba(255, 255, 255, .06);
      --seg-on: #3a3a3c;
      --switch-off: rgba(255, 255, 255, .16);
      --shadow: 0 0 0 .5px rgba(255, 255, 255, .1), 0 20px 60px rgba(0, 0, 0, .6);
      --menu-shadow: 0 0 0 .5px rgba(255, 255, 255, .12), 0 8px 24px rgba(0, 0, 0, .5);
      --c-installer: #aeaeb2;
    }
  }

  /* 主题：热带雨林（深色，树冠下的绿） */
  :root[data-theme="rainforest"] {
    --page: #08130e; --window: #11211a; --sidebar: #0d1b14; --menu: #182d22; --card: #163024;
    --text: #e4f1e8; --text-2: #97b5a3; --text-3: #5b7867;
    --line: rgba(228, 241, 232, .08); --tree: rgba(228, 241, 232, .18);
    --hover: rgba(228, 241, 232, .06); --selected: rgba(80, 210, 140, .16); --track: rgba(228, 241, 232, .1);
    --accent: #3fcf8e; --on-accent: #06281a; --danger: #ff6b5b;
    --seg-bg: rgba(228, 241, 232, .07); --seg-on: #23402f; --switch-off: rgba(228, 241, 232, .18);
    --shadow: 0 0 0 .5px rgba(228, 241, 232, .1), 0 20px 60px rgba(0, 0, 0, .6);
    --menu-shadow: 0 0 0 .5px rgba(228, 241, 232, .12), 0 8px 24px rgba(0, 0, 0, .5);
    --c-installer: #a8b8ae;
  }
  /* 主题：初夏橙皮（暖奶油底，橙色点缀） */
  :root[data-theme="orange"] {
    --page: #f1e2d0; --window: #fffaf3; --sidebar: #fbefdf; --menu: #fffaf3; --card: #fbf0e2;
    --text: #3b2a1c; --text-2: #8a6a50; --text-3: #c2a284;
    --line: rgba(120, 70, 20, .1); --tree: rgba(120, 70, 20, .22);
    --hover: rgba(244, 115, 33, .07); --selected: rgba(244, 115, 33, .15); --track: rgba(120, 70, 20, .1);
    --accent: #f47321; --on-accent: #ffffff; --danger: #d93a2b;
    --seg-bg: rgba(120, 70, 20, .07); --seg-on: #ffffff; --switch-off: rgba(120, 70, 20, .16);
    --shadow: 0 0 0 .5px rgba(120, 70, 20, .14), 0 20px 60px rgba(120, 70, 20, .2);
    --menu-shadow: 0 0 0 .5px rgba(120, 70, 20, .14), 0 8px 24px rgba(120, 70, 20, .16);
    --c-installer: #8a6a50;
  }
  /* 主题：雨后栀子（象牙白花瓣，湿润的灰绿叶） */
  :root[data-theme="gardenia"] {
    --page: #dfe5e1; --window: #fbfbf7; --sidebar: #f0f3ee; --menu: #ffffff; --card: #f2f4ef;
    --text: #26302b; --text-2: #69766f; --text-3: #a3aea8;
    --line: rgba(40, 60, 50, .08); --tree: rgba(40, 60, 50, .18);
    --hover: rgba(40, 60, 50, .05); --selected: rgba(94, 140, 120, .15); --track: rgba(40, 60, 50, .08);
    --accent: #5e8c78; --on-accent: #ffffff; --danger: #c9594d;
    --seg-bg: rgba(40, 60, 50, .05); --seg-on: #ffffff; --switch-off: rgba(40, 60, 50, .14);
    --shadow: 0 0 0 .5px rgba(40, 60, 50, .12), 0 20px 60px rgba(40, 60, 50, .18);
    --menu-shadow: 0 0 0 .5px rgba(40, 60, 50, .12), 0 8px 24px rgba(40, 60, 50, .14);
  }
  /* 背景图：按图片明暗切换文字深浅，再盖一层同色调的半透明蒙版保证看得清 */
  :root[data-ink="dark"] {
    --text: #1d1d1f; --text-2: #48484d; --text-3: #7c7c82;
    --line: rgba(0, 0, 0, .08); --tree: rgba(0, 0, 0, .2); --hover: rgba(0, 0, 0, .06);
    --selected: rgba(0, 0, 0, .09); --track: rgba(0, 0, 0, .1); --seg-bg: rgba(0, 0, 0, .06);
    --veil: rgba(255, 255, 255, .66); --veil-strong: rgba(255, 255, 255, .78);
  }
  :root[data-ink="light"] {
    --text: #f5f5f7; --text-2: #c7c7cc; --text-3: #8e8e93;
    --line: rgba(255, 255, 255, .1); --tree: rgba(255, 255, 255, .22); --hover: rgba(255, 255, 255, .08);
    --selected: rgba(255, 255, 255, .14); --track: rgba(255, 255, 255, .14); --seg-bg: rgba(255, 255, 255, .1);
    --seg-on: rgba(255, 255, 255, .2);
    --veil: rgba(0, 0, 0, .46); --veil-strong: rgba(0, 0, 0, .58);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  ::selection { background: color-mix(in srgb, var(--accent) 25%, transparent); }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--page);
    color: var(--text);
    font: var(--fs)/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    user-select: none;
  }
  body.resizing { cursor: col-resize; }
  button {
    font: inherit; color: inherit; background: none; border: 0; padding: 0;
    cursor: default; outline: none;
  }
  textarea, input { outline: none; }
  /* 只给键盘焦点一圈跟主题走的中性细环，不用蓝色 */
  button:focus-visible, [role="separator"]:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--text) 22%, transparent);
  }
  svg { display: block; }

  /* 窗口 */
  .window {
    position: relative;
    width: min(980px, calc(100vw - 48px));
    height: min(640px, calc(100vh - 80px));
    margin-top: 24px;
    background: var(--window) center / cover no-repeat;
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: var(--side-w) 1fr;
    overflow: hidden;
  }
  .window.has-bg { background-image: var(--bg-image); }
  .window.has-bg .sidebar { background: var(--veil-strong); backdrop-filter: blur(24px); }
  .window.has-bg .main { background: var(--veil); backdrop-filter: blur(24px); }
  .window.dropping::after {
    content: "";
    position: absolute; inset: 6px;
    border: 2px solid var(--accent);
    border-radius: 9px;
    pointer-events: none;
  }

  /* 侧栏 */
  .sidebar {
    position: relative;
    background: var(--sidebar);
    border-right: 1px solid var(--line);
    padding: 14px 10px 10px;
    display: flex; flex-direction: column; gap: 1px;
    min-width: 0;
  }
  .traffic { display: flex; gap: 8px; padding: 0 4px 18px; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; background: var(--text-3); opacity: .35; }
  .side-scroll { position: relative; display: flex; flex-direction: column; gap: 1px; overflow-y: auto; min-height: 0; }
  .side-thumb {
    position: absolute; top: 0; left: 0;
    border-radius: 6px; background: var(--selected);
    pointer-events: none;
  }
  .ready .side-thumb { transition: transform .28s var(--ease), width .28s var(--ease), height .28s var(--ease); }
  .resizing .side-thumb { transition: none; }
  .side-item {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; height: 28px; padding: 0 10px; border-radius: 6px; text-align: left;
    color: var(--text-2);
    transition: color .2s;
  }
  .side-item > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .side-item:hover { background: var(--hover); }
  .side-item[aria-current="true"] { color: var(--text); }
  .side-item[data-level="1"] { font-weight: 600; color: var(--text); }
  .side-item .count { color: var(--text-3); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; font-weight: 400; }
  .side-item.drop-target { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .side-item input {
    width: 100%; height: 22px; margin-left: -4px; padding: 0 4px; border-radius: 5px;
    border: 1px solid color-mix(in srgb, var(--text) 20%, transparent);
    background: var(--window); color: var(--text); font: inherit; user-select: text;
  }
  .side-gap { height: 10px; flex: none; }

  /* 子分类：竖线 + 圆角折钩挂在上一级下面，可以嵌套 */
  .side-children { display: flex; flex-direction: column; gap: 1px; margin-left: 18px; }
  .node { position: relative; margin-left: 14px; display: flex; flex-direction: column; gap: 1px; }
  .node::before, .node:not(:last-child)::after {
    content: ""; position: absolute; left: -14px; border-left: 1px solid var(--tree);
  }
  .node::before {
    top: -1px; height: 15px; width: 10px;
    border-bottom: 1px solid var(--tree); border-bottom-left-radius: 6px;
  }
  .node:not(:last-child)::after { top: 14px; bottom: -1px; }

  .side-bottom { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 1px; }
  .side-bottom .side-item { justify-content: flex-start; color: var(--text-2); font-weight: 400; }

  .resizer {
    position: absolute; top: 0; bottom: 0; right: -4px; width: 8px;
    cursor: col-resize; z-index: 2;
  }
  .resizer::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px;
    background: var(--accent); opacity: 0; transition: opacity .15s;
  }
  .resizer:hover::after, .resizing .resizer::after { opacity: .5; }

  /* 主区 */
  .main { display: grid; grid-template-rows: 52px 1fr 32px; min-width: 0; min-height: 0; }
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px 0 20px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar h1 { font-size: var(--fs-title); font-weight: 600; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .segmented { position: relative; display: flex; background: var(--seg-bg); border-radius: 7px; padding: 2px; }
  .toolbar .segmented { margin-right: 6px; }
  .seg-thumb {
    position: absolute; top: 0; left: 0;
    background: var(--seg-on); border-radius: 5px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
  }
  .ready .seg-thumb { transition: transform .28s var(--ease), width .28s var(--ease); }
  .segmented button {
    position: relative; height: 22px; padding: 0 12px; border-radius: 5px;
    font-size: var(--fs-xs); color: var(--text-2); transition: color .2s;
  }
  .segmented button[aria-pressed="true"] { color: var(--text); }
  .icon-btn {
    width: 28px; height: 28px; border-radius: 6px; flex: none;
    display: grid; place-items: center; color: var(--text-2);
  }
  .icon-btn:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .icon-btn:disabled { opacity: .35; }

  /* 任务列表 */
  .list { list-style: none; margin: 0; padding: 6px 10px; overflow-y: auto; }
  .row {
    display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center;
    padding: 10px; border-radius: 8px;
  }
  .row:hover { background: var(--hover); }
  .row.enter, .empty.enter { animation: row-in .26s var(--ease) both; animation-delay: calc(var(--i, 0) * 22ms); }
  @keyframes row-in { from { opacity: 0; transform: translateY(6px); } }
  .ficon {
    width: 36px; height: 36px; border-radius: 8px;
    display: grid; place-items: center;
    font-size: 9.5px; font-weight: 700; letter-spacing: .02em;
    color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent);
  }
  .body { min-width: 0; display: grid; gap: 5px; }
  .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width .5s linear; }
  [data-status="paused"] .bar i,
  [data-status="queued"] .bar i { background: var(--text-3); }
  [data-status="failed"] .bar i { background: var(--danger); }
  [data-status="completed"] .bar { display: none; }
  .meta { font-size: var(--fs-sm); color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  [data-status="failed"] .meta { color: var(--danger); }
  .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
  .row:hover .actions, .row:focus-within .actions { opacity: 1; }

  .empty { display: grid; place-items: center; color: var(--text-3); height: 100%; }
  .statusbar {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 0 20px; border-top: 1px solid var(--line);
    font-size: var(--fs-sm); color: var(--text-2); font-variant-numeric: tabular-nums;
  }

  /* 弹窗：居中，淡入 + 轻微放大 */
  .scrim {
    position: absolute; inset: 0; z-index: 10;
    background: rgba(0, 0, 0, .18);
    display: none; place-items: center;
  }
  .scrim.open { display: grid; animation: fade-in .16s ease-out; }
  @keyframes fade-in { from { opacity: 0; } }
  .dialog {
    width: min(460px, calc(100% - 40px));
    background: var(--window);
    color: var(--text);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px;
    animation: pop-in .2s var(--ease);
  }
  @keyframes pop-in { from { opacity: 0; transform: scale(.96); } }
  .dialog h2 { font-size: var(--fs); font-weight: 600; margin: 0 0 6px; }
  .dialog-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .dialog-head h2 { margin: 0; }
  .dialog textarea {
    width: 100%; height: 120px; resize: none;
    border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    background: var(--sidebar); color: var(--text);
    font: var(--fs-xs)/1.5 ui-monospace, "SF Mono", Menlo, monospace;
    user-select: text;
    transition: border-color .15s;
  }
  .dialog textarea:focus { border-color: color-mix(in srgb, var(--text) 20%, transparent); }
  .dialog .error { color: var(--danger); font-size: var(--fs-xs); min-height: 18px; padding-top: 4px; }
  .dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; }
  .btn { height: 26px; padding: 0 14px; border-radius: 6px; background: var(--seg-bg); }
  .btn.small { height: 22px; padding: 0 10px; font-size: var(--fs-xs); }
  .btn.primary { background: var(--accent); color: var(--on-accent); }

  /* 设置项：常规 / 外观两页，页签同样是滑块 */
  .settings { margin-bottom: 14px; }
  .settings[hidden] { display: none; }
  .setting {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-height: 42px; border-bottom: 1px solid var(--line);
  }
  .setting:last-child { border-bottom: 0; }
  .setting .value { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .setting .status { color: var(--text-2); font-size: var(--fs-xs); white-space: nowrap; }
  .setting .path { color: var(--text-2); font: var(--fs-xs) ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 更新检测：望云时雨点依次落下，有新雨时雨点停住、变强调色 */
  .sky { display: none; width: 18px; height: 16px; flex: none; color: var(--text-2); overflow: visible; }
  [data-update="checking"] .sky, [data-update="available"] .sky { display: block; }
  [data-update="available"] .sky { color: var(--accent); }
  [data-update="checking"] .drops line { animation: rain .9s ease-in infinite; }
  .drops line:nth-child(2) { animation-delay: .3s; }
  .drops line:nth-child(3) { animation-delay: .6s; }
  @keyframes rain { 0% { opacity: 0; transform: translateY(-3px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(3px); } }
  #updateStatus { animation: fade-in .22s ease-out; }
  [data-update="failed"] #updateStatus { color: var(--danger); }

  .switch {
    position: relative; width: 32px; height: 19px; border-radius: 10px; flex: none;
    background: var(--switch-off); transition: background .2s;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    transition: transform .2s var(--ease);
  }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(13px); }

  /* 自绘下拉：按钮 + 下方列表，Esc / 点外面收起 */
  .dropdown { position: relative; }
  .dd-btn {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    min-width: 108px; height: 24px; padding: 0 8px 0 10px; border-radius: 6px;
    background: var(--seg-bg); font-size: var(--fs-xs);
  }
  .dd-btn svg { color: var(--text-2); transition: transform .2s var(--ease); }
  .dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
  .dd-list {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
    min-width: 100%; padding: 4px; border-radius: 8px;
    background: var(--menu); box-shadow: var(--menu-shadow);
    display: none; flex-direction: column;
  }
  .dd-list.open { display: flex; animation: menu-in .14s var(--ease); }
  @keyframes menu-in { from { opacity: 0; transform: translateY(-4px); } }
  .dd-opt {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    height: 24px; padding: 0 8px 0 6px; border-radius: 5px; font-size: var(--fs-xs); text-align: left; white-space: nowrap;
  }
  .dd-opt::after { content: "✓"; width: 12px; font-size: 11px; visibility: hidden; }
  .dd-opt[aria-selected="true"]::after { visibility: visible; }
  .dd-opt:hover, .dd-opt:focus-visible { background: var(--accent); color: var(--on-accent); box-shadow: none; }

  /* 右键菜单：自绘，跟主题变色 */
  .ctx {
    position: fixed; z-index: 40; min-width: 160px; padding: 4px; border-radius: 8px;
    background: var(--menu); color: var(--text); box-shadow: var(--menu-shadow);
    display: none; flex-direction: column;
  }
  .ctx.open { display: flex; animation: menu-in .14s var(--ease); }
  .ctx button { height: 24px; padding: 0 10px; border-radius: 5px; font-size: var(--fs-xs); text-align: left; white-space: nowrap; }
  .ctx button:hover { background: var(--accent); color: var(--on-accent); }
  .ctx button.danger { color: var(--danger); }
  .ctx button.danger:hover { background: var(--danger); color: #fff; }
  .ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
  .ctx .heading { padding: 2px 10px; font-size: 11px; color: var(--text-3); }

  .toast {
    position: absolute; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 30;
    background: var(--text); color: var(--window);
    padding: 6px 12px; border-radius: 8px; font-size: var(--fs-xs);
    opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: .92; }

  /* 模拟菜单栏 + 状态栏面板（仿 Vorssaint：顶部图标、页签、小标题、卡片、底部两个按钮） */
  .menubar {
    position: fixed; top: 0; left: 0; right: 0; height: 24px; z-index: 50;
    display: flex; align-items: center; justify-content: flex-end; gap: 4px; padding: 0 12px;
    background: color-mix(in srgb, var(--page) 70%, #3478f6); color: #fff; font-size: 12px;
  }
  .menubar[hidden] { display: none; }
  .mb-item {
    display: flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 6px;
    color: #fff; font-variant-numeric: tabular-nums;
  }
  .mb-item:hover, .mb-item[aria-expanded="true"] { background: rgba(255, 255, 255, .22); }
  .mb-item .speed { font-size: 10.5px; line-height: 1; }
  .panel {
    position: fixed; top: 32px; z-index: 50; width: 320px;
    background: var(--window); color: var(--text);
    border-radius: 22px; box-shadow: var(--shadow);
    padding: 18px 14px 14px;
    display: none; flex-direction: column; gap: 10px;
  }
  .panel.open { display: flex; animation: pop-in .18s var(--ease); transform-origin: top center; }
  .panel-logo { display: grid; place-items: center; color: var(--text); padding: 2px 0 4px; }
  .panel-tabs { position: relative; display: flex; padding: 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
  .panel-tabs .tab-thumb { position: absolute; top: 0; left: 0; border-radius: 9px; background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .ready .panel-tabs .tab-thumb { transition: transform .28s var(--ease), width .28s var(--ease); }
  .panel-tabs button { position: relative; flex: 1; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--text-2); }
  .panel-tabs button[aria-pressed="true"] { color: var(--accent); }
  .panel-title { font-size: var(--fs-xs); font-weight: 600; color: var(--text-2); padding: 0 2px; }
  .panel-card {
    border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    padding: 4px; max-height: 300px; overflow-y: auto; display: grid; gap: 2px;
  }
  .p-row { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 8px; border-radius: 10px; }
  .p-row:hover { background: var(--hover); }
  .p-row .ficon { width: 28px; height: 28px; border-radius: 7px; font-size: 8px; }
  .p-row .body { gap: 4px; }
  /* 两页叠在同一格里只显示当前页，卡片高度取较高的一页，切页签时面板不跳 */
  .p-page { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 2px; }
  .p-page:not(.current) { visibility: hidden; }
  .p-empty { padding: 22px 8px; text-align: center; color: var(--text-3); font-size: var(--fs-xs); }
  .panel-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .panel-foot button {
    height: 32px; border-radius: 10px; border: 1px solid var(--line); background: var(--window);
    display: flex; align-items: center; justify-content: center; gap: 6px; font-size: var(--fs-xs);
  }
  .panel-foot button:hover { background: var(--hover); }

  @media (max-width: 640px) {
    .window { width: 100vw; height: calc(100vh - 24px); border-radius: 0; grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .segmented button { padding: 0 8px; }
    .actions { opacity: 1; }
    .panel { right: 8px !important; left: 8px !important; width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
    .drops line { animation: none !important; }
  }
</style>
</head>

  window:   '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 6h12"/></svg>',
  // 应用图标的线稿水滴，菜单栏和面板顶部共用
  drop: (size) => `<svg width="${size}" height="${size}" viewBox="230 240 564 610" fill="none" stroke="currentColor" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"><path d="M512 290 C462 368 382 460 382 568 a130 130 0 0 0 260 0 C642 460 562 368 512 290 Z"/><path d="M262 750 A250 46 0 0 0 762 750"/></svg>`,
};

const view = { key: 'all', status: 'all' };   // key：'all' | 'type:video' | 'group:<id>'
const settings = {
  dir: '~/Downloads', maxActive: 3, threads: 'auto', classify: true, learn: true, notify: true, menuBar: true,
  theme: 'system', fontSize: BASE_TEXT_SIZE, language: 'auto', background: null,
};
let tasks = [];
let groups = [];          // 自定义分类：{ id, name, parent }，parent 为 null 时和「全部」并列
let habits = new Map();   // 学到的习惯：'host:x' / 'ext:x' → { group, count }
let nextId = 1;
let panelTab = 'active';

const $ = (id) => document.getElementById(id);

function lang() {
  if (settings.language !== 'auto') return settings.language;
  return navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en';
}

function t(key, ...args) {
  const value = STRINGS[lang()][key] ?? STRINGS.zh[key];
  return typeof value === 'function' ? value(...args) : value;
}

/* ---------- 数据 ---------- */

/* 扩展连上的浏览器，null 表示未连接 */
let linkedBrowser = null;

// 按扩展名判断类型；.tar.gz 取最后一段 gz，同样归压缩包
function typeOf(name) {
  const ext = extOf(name);
  return (TYPES.find((c) => c.exts.includes(ext)) || TYPES.at(-1)).id;
}

const extOf = (name) => (name.includes('.') ? name.split('.').pop().toLowerCase() : '');
const groupById = (id) => groups.find((g) => g.id === id);
const childrenOf = (parent) => groups.filter((g) => g.parent === parent);

function depthOf(id) {
  let depth = 0;
  for (let g = groupById(id); g; g = groupById(g.parent)) depth++;
  return depth;
}

// 分类自己 + 所有子孙，选中上级时显示整棵子树的任务
function subtreeIds(id) {
  return [id, ...childrenOf(id).flatMap((g) => subtreeIds(g.id))];
}

function groupPath(id) {
  const names = [];
  for (let g = groupById(id); g; g = groupById(g.parent)) names.unshift(g.name);
  return names;
}

function titleOf(key) {
  if (key === 'all') return t('all');
  const [kind, id] = key.split(':');
  return kind === 'type' ? t(id) : groupById(id)?.name ?? t('all');
}

function extLabel(name) {
  const ext = name.includes('.') ? name.split('.').pop() : '';
  return ext.slice(0, 4).toUpperCase() || '—';
}

function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ''); } catch { return ''; }
}

function makeTask(name, size, done = 0, status = 'queued', url = '', group = null) {
  return {
    id: nextId++, name, url, size, done, status, group,
    type: typeOf(name),
    speed: 0,
    baseSpeed: (2 + Math.random() * 10) * MB,
  };
}

// 重名时加 " (1)"，和 App 落盘规则一致
function uniqueName(name) {
  const taken = new Set(tasks.map((x) => x.name));
  if (!taken.has(name)) return name;
  const dot = name.lastIndexOf('.');
  const stem = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : '';
  for (let n = 1; ; n++) {
    const candidate = `${stem} (${n})${ext}`;
    if (!taken.has(candidate)) return candidate;
  }
}

function parseUrls(text) {
  return text.split(/\s+/).filter((s) => {
    try { return /^https?:$/.test(new URL(s).protocol); } catch { return false; }
  });
}

function nameFromUrl(url) {
  const last = new URL(url).pathname.split('/').filter(Boolean).pop();
  if (!last) return 'download';
  try { return decodeURIComponent(last); } catch { return last; }
}

// 有自定义分类就放进分类的文件夹，否则按类型分
function savePath(task) {
  if (task.group) return [settings.dir, ...groupPath(task.group), task.name].join('/');
  return settings.classify ? `${settings.dir}/${t(task.type)}/${task.name}` : `${settings.dir}/${task.name}`;
}

function addUrls(urls) {
  let learnedGroup = null;
  for (const url of urls) {
    const task = makeTask(uniqueName(nameFromUrl(url)), (20 + Math.random() * 1500) * MB, 0, 'queued', url);
    const suggestion = settings.learn ? suggestGroup(task) : null;
    if (suggestion) { task.group = suggestion; learnedGroup = suggestion; }
    tasks.push(task);
  }
  schedule();
  renderAll();
  toast(learnedGroup ? t('learned', groupById(learnedGroup).name) : t('added', urls.length));
}

/* ---------- 习惯学习：手动归类时记下来源网站和扩展名 ---------- */

function habitKeys(task) {
  const host = hostOf(task.url);
  return [host && `host:${host}`, `ext:${extOf(task.name)}`].filter(Boolean);
}

function learn(task, group) {
  for (const key of habitKeys(task)) {
    const habit = habits.get(key);
    habits.set(key, habit?.group === group ? { group, count: habit.count + 1 } : { group, count: 1 });
  }
}

// 来源网站优先于扩展名；分类被删了就不再用
function suggestGroup(task) {
  for (const key of habitKeys(task)) {
    const habit = habits.get(key);
    if (habit && habit.count >= LEARN_THRESHOLD && groupById(habit.group)) return habit.group;
  }
  return null;
}

function moveToGroup(task, group) {
  task.group = group;
  if (group) learn(task, group);
  renderAll();
  toast(group ? t('movedTo', groupById(group).name) : t('noGroup'));
}

/* ---------- 分类管理 ---------- */

let renamingId = null;

function createGroup(parent) {
  if (parent && depthOf(parent) >= MAX_DEPTH) return;
  const group = { id: `g${Date.now()}`, name: t('untitled'), parent };
  groups.push(group);
  renamingId = group.id;
  buildSidebar();
}

function deleteGroup(id) {
  const ids = new Set(subtreeIds(id));
  const name = groupById(id).name;
  groups = groups.filter((g) => !ids.has(g.id));
  for (const task of tasks) if (ids.has(task.group)) task.group = null;
  if (view.key.startsWith('group:') && ids.has(view.key.slice(6))) view.key = 'all';
  buildSidebar();
  renderAll(true);
  toast(t('deleted', name));
}

function commitRename(input, id) {
  const name = input.value.trim();
  const group = groupById(id);
  if (group && name) group.name = name;
  renamingId = null;
  buildSidebar();
  renderAll();
}

// 让下载中的任务数等于上限：超出的退回排队，空位从排队里补
function schedule() {
  let active = 0;
  for (const task of tasks) {
    if (task.status !== 'downloading') continue;
    if (active < settings.maxActive) active++;
    else { task.status = 'queued'; task.speed = 0; }
  }
  for (const task of tasks) {
    if (active >= settings.maxActive) break;
    if (task.status === 'queued') { task.status = 'downloading'; active++; }
  }
}

function setStatus(task, status) {
  task.status = status;
  task.speed = 0;
  schedule();
  renderAll();
}

/* ---------- 格式化 ---------- */

function fmtBytes(bytes) {
  const units = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
  return `${bytes.toFixed(i < 2 ? 0 : 1)} ${units[i]}`;
}

function fmtEta(seconds) {
  if (seconds < 60) return `${Math.ceil(seconds)} ${t('sec')}`;
  if (seconds < 3600) return `${Math.ceil(seconds / 60)} ${t('min')}`;
  return `${(seconds / 3600).toFixed(1)} ${t('hour')}`;
}

function metaText(task) {
  const progress = `${fmtBytes(task.done)} / ${fmtBytes(task.size)}`;
  switch (task.status) {
    case 'downloading': return `${fmtBytes(task.speed)}/s · ${t('left')} ${fmtEta((task.size - task.done) / (task.speed || 1))} · ${progress}`.replace('·  ', '· ');
    case 'queued':      return `${t('queued')} · ${fmtBytes(task.size)}`;
    case 'paused':      return `${t('paused')} · ${progress}`;
    case 'failed':      return `${t('failed')} · ${progress}`;
    default:            return `${fmtBytes(task.size)} · ${task.group ? groupById(task.group).name : t(task.type)}`;
  }
}

const totalSpeed = () => tasks.filter((x) => x.status === 'downloading').reduce((sum, x) => sum + x.speed, 0);

/* ---------- 外观：主题、字号、背景、语言 ---------- */

function applyAppearance() {
  const root = document.documentElement;
  if (settings.theme === 'system') delete root.dataset.theme; else root.dataset.theme = settings.theme;
  root.style.setProperty('--scale', settings.fontSize / BASE_TEXT_SIZE);
  root.lang = lang() === 'zh' ? 'zh-CN' : 'en';
  const win = $('window');
  win.classList.toggle('has-bg', Boolean(settings.background));
  if (settings.background) {
    win.style.setProperty('--bg-image', `url("${settings.background.url}")`);
    root.dataset.ink = settings.background.bright ? 'dark' : 'light';
  } else {
    delete root.dataset.ink;
  }
  $('clearBg').hidden = !settings.background;
}

// 取图片平均亮度：缩到 32×32 求相对亮度，亮图配深色字，暗图配浅色字
function measureBrightness(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 32;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 32, 32);
      const data = ctx.getImageData(0, 0, 32, 32).data;
      let sum = 0;
      for (let i = 0; i < data.length; i += 4) sum += 0.2126 * data[i] + 0.7152 * data[i + 1] + 0.0722 * data[i + 2];
      resolve(sum / (data.length / 4) / 255);
    };
    img.onerror = () => reject(new Error('图片读不出来'));
    img.src = url;
  });
}

function translateStatic() {
  for (const el of document.querySelectorAll('[data-i18n]')) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll('[data-i18n-placeholder]')) el.placeholder = t(el.dataset.i18nPlaceholder);
  for (const el of document.querySelectorAll('[data-i18n-label]')) el.setAttribute('aria-label', t(el.dataset.i18nLabel));
  $('sidebar').setAttribute('aria-label', t('settings'));
  renderBrowserLink();
  renderUpdate(false);
  $('resizer').setAttribute('aria-label', lang() === 'zh' ? '调整侧栏宽度' : 'Resize sidebar');
  $('addBtn').setAttribute('aria-label', t('add'));
  $('addBtn').title = t('add');
  $('settingsBtn').innerHTML = `${ICONS.sliders}<span>${t('settings')}</span>`;
  $('settingsBtn').title = `${t('settings')}（⌘,）`;
  $('newGroupBtn').innerHTML = `${ICONS.folderPlus}<span>${t('newGroup')}</span>`;
  const [activeTab, doneTab] = $('panelTabs').querySelectorAll('button');
  activeTab.innerHTML = ICONS.arrowDown; activeTab.setAttribute('aria-label', t('panelActive'));
  doneTab.innerHTML = ICONS.check; doneTab.setAttribute('aria-label', t('panelDone'));
  $('panelOpen').innerHTML = `${ICONS.window}<span>${t('panelOpen')}</span>`;
  $('panelQuit').innerHTML = `${ICONS.power}<span>${t('panelQuit')}</span>`;
  document.querySelectorAll('.dropdown').forEach((dd) => dd.sync?.());
}

/* ---------- 渲染 ---------- */

function visibleTasks() {
  return tasks.filter((task) => matchesKey(task, view.key) &&
    (view.status === 'all' || (view.status === 'done') === (task.status === 'completed')));
}

function matchesKey(task, key) {
  if (key === 'all') return true;
  const [kind, id] = key.split(':');
  if (kind === 'type') return task.type === id;
  return subtreeIds(id).includes(task.group);
}

// 把滑块移到目标元素位置，过渡动画由 CSS 负责
function moveThumb(thumb, target) {
  thumb.style.transform = `translate(${target.offsetLeft}px, ${target.offsetTop}px)`;
  thumb.style.width = `${target.offsetWidth}px`;
  thumb.style.height = `${target.offsetHeight}px`;
}

function sideItem(key, label, level) {
  const btn = document.createElement('button');
  btn.className = 'side-item';
  btn.dataset.key = key;
  btn.dataset.level = level;
  btn.innerHTML = '<span></span><span class="count"></span>';
  btn.firstChild.textContent = label;
  return btn;
}

// 一个节点 = 自己这一行 + 子节点容器，折钩画在节点上，子树多深都能接上线
function groupNode(group, level) {
  const node = document.createElement('div');
  node.className = level === 1 ? '' : 'node';
  const item = sideItem(`group:${group.id}`, group.name, level);
  if (renamingId === group.id) {
    const input = document.createElement('input');
    input.value = group.name;
    input.setAttribute('aria-label', t('rename'));
    item.firstChild.replaceWith(input);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') input.blur();
      if (e.key === 'Escape') { input.value = group.name; input.blur(); }
      e.stopPropagation();
    });
    input.addEventListener('blur', () => commitRename(input, group.id));
    requestAnimationFrame(() => { input.focus(); input.select(); });
  }
  node.append(item);
  const kids = childrenOf(group.id);
  if (kids.length) {
    const box = document.createElement('div');
    box.className = 'side-children';
    kids.forEach((kid) => box.append(groupNode(kid, level + 1)));
    node.append(box);
  }
  return node;
}

function buildSidebar() {
  const tree = $('sideTree');
  tree.replaceChildren();
  tree.append(sideItem('all', t('all'), 1));
  const types = document.createElement('div');
  types.className = 'side-children';
  for (const type of TYPES) {
    const node = document.createElement('div');
    node.className = 'node';
    node.append(sideItem(`type:${type.id}`, t(type.id), 2));
    types.append(node);
  }
  tree.append(types);
  for (const group of childrenOf(null)) {
    const gap = document.createElement('div');
    gap.className = 'side-gap';
    tree.append(gap, groupNode(group, 1));
  }
  lastSideItem = null;
  renderSidebar();
}

// 跨级切换：旧位置留个影子淡出，滑块瞬移到新位置淡入
function fadeThumb(thumb, target) {
  const duration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : FADE_MS;
  const ghost = thumb.cloneNode();
  ghost.removeAttribute('id');
  thumb.after(ghost);
  ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration, easing: 'ease-out' }).onfinish = () => ghost.remove();
  thumb.style.transition = 'none';
  moveThumb(thumb, target);
  thumb.offsetWidth;   // 强制回流，让瞬移先生效再恢复过渡
  thumb.style.transition = '';
  thumb.animate([{ opacity: 0 }, { opacity: 1 }], { duration, easing: 'ease-out' });
}

let lastSideItem = null;

function renderSidebar() {
  let current;
  for (const item of $('sideTree').querySelectorAll('[data-key]')) {
    const key = item.dataset.key;
    const count = tasks.filter((task) => matchesKey(task, key)).length;
    item.querySelector('.count').textContent = count || '';
    item.setAttribute('aria-current', String(view.key === key));
    if (view.key === key) current = item;
  }
  if (!current) return;
  const crossLevel = lastSideItem && lastSideItem !== current && lastSideItem.dataset.level !== current.dataset.level;
  if (crossLevel) fadeThumb($('sideThumb'), current);
  else moveThumb($('sideThumb'), current);
  lastSideItem = current;
}

function toggleAction(status) {
  switch (status) {
    case 'downloading':
    case 'queued':    return ['pause', t('pause')];
    case 'paused':    return ['play', t('resume')];
    case 'failed':    return ['retry', t('retry')];
    default:          return ['folder', t('reveal')];
  }
}

function updateRow(row, task) {
  row.dataset.status = task.status;
  row.querySelector('.bar i').style.width = `${(task.done / task.size) * 100}%`;
  row.querySelector('.meta').textContent = metaText(task);
}

function fileIcon(el, task) {
  el.textContent = extLabel(task.name);
  el.style.setProperty('--c', `var(--c-${task.type})`);
}

// animate 只在切换筛选时为 true，状态变化引起的重绘不闪
function renderList(animate) {
  const list = $('list');
  const items = visibleTasks();
  list.replaceChildren();
  if (!items.length) {
    const empty = document.createElement('li');
    empty.className = animate ? 'empty enter' : 'empty';
    empty.textContent = tasks.length ? t('emptyFilter') : t('emptyAll');
    list.append(empty);
    return;
  }
  items.forEach((task, i) => {
    const row = $('rowTpl').content.firstElementChild.cloneNode(true);
    row.dataset.id = task.id;
    if (animate) {
      row.classList.add('enter');
      row.style.setProperty('--i', Math.min(i, STAGGER_CAP));
    }
    fileIcon(row.querySelector('.ficon'), task);
    row.querySelector('.name').textContent = task.name;
    row.querySelector('.name').title = task.name;
    const [icon, label] = toggleAction(task.status);
    const toggle = row.querySelector('[data-act="toggle"]');
    toggle.innerHTML = ICONS[icon];
    toggle.setAttribute('aria-label', label);
    toggle.title = label;
    const remove = row.querySelector('[data-act="remove"]');
    remove.innerHTML = ICONS.close;
    remove.setAttribute('aria-label', t('removeTask'));
    remove.title = t('removeTask');
    updateRow(row, task);
    list.append(row);
  });
}

function renderToolbar() {
  $('title').textContent = titleOf(view.key);
  let current;
  for (const b of $('segmented').querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.dataset.status === view.status));
    if (b.dataset.status === view.status) current = b;
  }
  moveThumb($('segThumb'), current);
  const running = tasks.some((x) => x.status === 'downloading' || x.status === 'queued');
  const paused = tasks.some((x) => x.status === 'paused');
  const btn = $('pauseAll');
  const label = running ? t('pauseAll') : t('resumeAll');
  btn.innerHTML = running ? ICONS.pause : ICONS.play;
  btn.setAttribute('aria-label', label);
  btn.title = label;
  btn.disabled = !running && !paused;
}

function renderStatusbar() {
  const active = tasks.filter((x) => x.status === 'downloading');
  $('statusbar').textContent = active.length ? t('downloading', active.length, fmtBytes(totalSpeed())) : '';
}

function renderMenuBar() {
  $('menubar').hidden = !settings.menuBar;
  if (!settings.menuBar) closePanel();
  const active = tasks.some((x) => x.status === 'downloading');
  $('mbItem').innerHTML = ICONS.drop(14) + (active ? `<span class="speed">${fmtBytes(totalSpeed())}/s</span>` : '');
  $('mbItem').setAttribute('aria-label', t('panelActive'));
}

function renderPanel() {
  if (!$('panel').classList.contains('open')) return;
  let current;
  for (const b of $('panelTabs').querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.dataset.tab === panelTab));
    if (b.dataset.tab === panelTab) current = b;
  }
  moveThumb($('tabThumb'), current);
  const active = tasks.filter((x) => x.status === 'downloading' || x.status === 'queued');
  const done = tasks.filter((x) => x.status === 'completed');
  const downloading = tasks.filter((x) => x.status === 'downloading').length;
  $('panelTitle').textContent = panelTab === 'active' ? t('panelTitle', downloading, fmtBytes(totalSpeed())) : t('panelDone');
  const pages = [['active', active], ['done', done.slice().reverse()]].map(([tab, all]) => {
    const page = document.createElement('div');
    page.className = 'p-page' + (tab === panelTab ? ' current' : '');
    fillPanelPage(page, tab, all.slice(0, PANEL_LIMIT));
    return page;
  });
  $('panelList').replaceChildren(...pages);
}

/* 菜单栏面板的一页：任务行，没有任务时一句空状态 */
function fillPanelPage(page, tab, items) {
  if (!items.length) {
    page.innerHTML = `<div class="p-empty">${tab === 'active' ? t('panelEmpty') : t('panelEmptyDone')}</div>`;
    return;
  }
  for (const task of items) {
    const row = document.createElement('div');
    row.className = 'p-row';
    row.dataset.id = task.id;
    row.innerHTML = '<div class="ficon"></div><div class="body"><div class="name"></div><div class="bar"><i></i></div><div class="meta"></div></div><button class="icon-btn" data-act="toggle"></button>';
    fileIcon(row.querySelector('.ficon'), task);
    row.querySelector('.name').textContent = task.name;
    const [icon, label] = toggleAction(task.status);
    const toggle = row.querySelector('[data-act="toggle"]');
    toggle.innerHTML = ICONS[icon];
    toggle.setAttribute('aria-label', label);
    updateRow(row, task);
    page.append(row);
  }
}

function renderAll(animate = false) {
  renderSidebar();
  renderToolbar();
  renderList(animate);
  renderStatusbar();
  renderMenuBar();
  renderPanel();
}

let toastTimer;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), TOAST_MS);
}

/* ---------- 模拟下载 ---------- */

function tick() {
  const finished = [];
  for (const task of tasks) {
    if (task.status !== 'downloading') continue;
    task.speed = task.baseSpeed * (0.7 + Math.random() * 0.6);
    task.done += task.speed * TICK_MS / 1000;
    if (task.done >= task.size) {
      task.done = task.size;
      task.status = 'completed';
      task.speed = 0;
      finished.push(task);
    }
  }
  if (finished.length) {
    schedule();
    renderAll();
    if (settings.notify) toast(t('finished', finished[0].name));
    return;
  }
  for (const row of document.querySelectorAll('.row, .p-row')) {
    const task = tasks.find((x) => x.id === Number(row.dataset.id));
    if (task && task.status === 'downloading') updateRow(row, task);
  }
  renderStatusbar();
  renderMenuBar();
  if ($('panel').classList.contains('open') && panelTab === 'active') {
    const downloading = tasks.filter((x) => x.status === 'downloading').length;
    $('panelTitle').textContent = t('panelTitle', downloading, fmtBytes(totalSpeed()));
  }
}

/* ---------- 侧栏拖宽 ---------- */

function setSidebarWidth(px) {
  const width = Math.round(Math.min(SIDEBAR_MAX, Math.max(SIDEBAR_MIN, px)));
  document.documentElement.style.setProperty('--side-w', `${width}px`);
  $('resizer').setAttribute('aria-valuenow', width);
  const current = $('sideTree').querySelector('[aria-current="true"]');
  if (current) moveThumb($('sideThumb'), current);   // 启动时还没渲染选中项
  return width;
}

function saveSidebarWidth(width) {
  try { localStorage.setItem(SIDEBAR_KEY, String(width)); } catch { /* 隐私模式下存不了，下次用默认宽度 */ }
}

function loadSidebarWidth() {
  try { return Number(localStorage.getItem(SIDEBAR_KEY)) || null; } catch { return null; }
}

$('resizer').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const resizer = e.currentTarget;
  const left = $('sidebar').getBoundingClientRect().left;
  resizer.setPointerCapture(e.pointerId);
  document.body.classList.add('resizing');
  let width;
  const onMove = (ev) => { width = setSidebarWidth(ev.clientX - left); };
  const onUp = () => {
    document.body.classList.remove('resizing');
    resizer.removeEventListener('pointermove', onMove);
    resizer.removeEventListener('pointerup', onUp);
    if (width) saveSidebarWidth(width);
  };
  resizer.addEventListener('pointermove', onMove);
  resizer.addEventListener('pointerup', onUp);
});

$('resizer').addEventListener('keydown', (e) => {
  const step = e.key === 'ArrowLeft' ? -10 : e.key === 'ArrowRight' ? 10 : 0;
  if (!step) return;
  e.preventDefault();
  saveSidebarWidth(setSidebarWidth($('sidebar').offsetWidth + step));
});

/* ---------- 弹窗 ---------- */

let openScrim = null;
let lastFocus = null;

function openDialog(id) {
  closeDialog();
  closePanel();
  lastFocus = document.activeElement;
  openScrim = $(id);
  openScrim.classList.add('open');
}

function closeDialog() {
  if (!openScrim) return;
  closeDropdown();
  openScrim.classList.remove('open');
  openScrim = null;
  lastFocus?.focus();
}

function openAdd() {
  openDialog('addScrim');
  $('urlError').textContent = '';
  $('urls').value = '';
  $('urls').focus();
}

function confirmAdd() {
  const urls = parseUrls($('urls').value);
  if (!urls.length) {
    $('urlError').textContent = t('noLinks');
    return;
  }
  closeDialog();
  addUrls(urls);
}

let settingsPage = 'general';

function showSettingsPage(page) {
  settingsPage = page;
  let current;
  for (const b of $('settingsTabs').querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.dataset.page === page));
    if (b.dataset.page === page) current = b;
  }
  moveThumb($('settingsThumb'), current);
  for (const p of $('settingsScrim').querySelectorAll('.settings')) p.hidden = p.dataset.page !== page;
}

function openSettings() {
  openDialog('settingsScrim');
  showSettingsPage(settingsPage);
  $('settingsScrim').querySelector('[data-close]').focus();
}

for (const scrim of document.querySelectorAll('.scrim')) {
  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) closeDialog(); });
  scrim.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', closeDialog));
}

$('settingsTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (btn && btn.dataset.page !== settingsPage) showSettingsPage(btn.dataset.page);
});

/* ---------- 设置控件 ---------- */

let openDd = null;

function closeDropdown() {
  if (!openDd) return;
  openDd.querySelector('.dd-list').classList.remove('open');
  openDd.querySelector('.dd-btn').setAttribute('aria-expanded', 'false');
  openDd = null;
}

function openDropdown(dd) {
  closeDropdown();
  openDd = dd;
  dd.querySelector('.dd-list').classList.add('open');
  dd.querySelector('.dd-btn').setAttribute('aria-expanded', 'true');
  (dd.querySelector('[aria-selected="true"]') || dd.querySelector('.dd-opt')).focus();
}

// 选项文案跟语言走，所以每次 sync 都重建列表
function setupDropdown(dd) {
  const key = dd.dataset.key;
  dd.innerHTML = `<button class="dd-btn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="${dd.dataset.label}"><span></span>${ICONS.chevron}</button><div class="dd-list" role="listbox"></div>`;
  const btn = dd.querySelector('.dd-btn');
  const list = dd.querySelector('.dd-list');
  dd.sync = () => {
    const options = SETTING_OPTIONS[key]();
    list.replaceChildren(...options.map((o) => {
      const opt = document.createElement('button');
      opt.className = 'dd-opt';
      opt.setAttribute('role', 'option');
      opt.dataset.value = o.value;
      opt.textContent = o.label;
      opt.setAttribute('aria-selected', String(o.value === settings[key]));
      return opt;
    }));
    btn.firstElementChild.textContent = options.find((o) => o.value === settings[key]).label;
  };
  btn.addEventListener('click', () => (openDd === dd ? closeDropdown() : openDropdown(dd)));
  list.addEventListener('click', (e) => {
    const opt = e.target.closest('.dd-opt');
    if (!opt) return;
    settings[key] = SETTING_OPTIONS[key]().find((o) => String(o.value) === opt.dataset.value).value;
    closeDropdown();
    btn.focus();
    applySettings();
  });
  list.addEventListener('keydown', (e) => {
    const opts = [...list.querySelectorAll('.dd-opt')];
    const i = opts.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); opts[Math.min(i + 1, opts.length - 1)].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); opts[Math.max(i - 1, 0)].focus(); }
  });
  dd.sync();
}

function setupSwitch(sw) {
  const key = sw.dataset.key;
  sw.sync = () => sw.setAttribute('aria-checked', String(settings[key]));
  sw.addEventListener('click', () => { settings[key] = !settings[key]; applySettings(); });
  sw.sync();
}

function applySettings() {
  schedule();
  applyAppearance();
  translateStatic();
  document.querySelectorAll('.switch').forEach((sw) => sw.sync());
  buildSidebar();
  renderAll();
  if (openScrim?.id === 'settingsScrim') showSettingsPage(settingsPage);
}

document.querySelectorAll('.dropdown').forEach(setupDropdown);
document.querySelectorAll('.switch').forEach(setupSwitch);

/* ---------- 更新检测：原型里第一次检查是「已是最新」，再检查一次「新雨已至」 ---------- */
const APP_VERSION = '1.3';
const UPDATE_DEMO_MS = 1800;
let update = { state: 'idle' };
let updateChecks = 0;
function renderUpdate(animate = true) {
  $('updateRow').dataset.update = update.state;
  const status = $('updateStatus');
  const button = $('updateBtn');
  status.textContent = {
    idle: t('updateCurrent', APP_VERSION), checking: t('updateChecking'), latest: t('updateLatest'),
    available: t('updateFound', update.version), failed: t('updateFailed'),
  }[update.state];
  button.hidden = update.state === 'checking';
  button.textContent = t({ available: 'updateGet', failed: 'updateRetry' }[update.state] ?? 'updateCheck');
  button.classList.toggle('primary', update.state === 'available');
  if (!animate) return;
  status.style.animation = 'none';
  void status.offsetWidth;  // 重放淡入
  status.style.animation = '';
}
$('updateBtn').addEventListener('click', () => {
  if (update.state === 'available') {
    // 拾雨自己就是下载器：新版安装包直接加进任务列表
    addUrls([`https://github.com/git-yafaya/RainKeep/releases/download/v${update.version}/Rainkeep-${update.version}.dmg`]);
    update = { state: 'idle' };
    renderUpdate();
    return;
  }
  update = { state: 'checking' };
  renderUpdate();
  setTimeout(() => {
    updateChecks++;
    update = updateChecks === 1 ? { state: 'latest' } : { state: 'available', version: '1.4' };
    renderUpdate();
  }, UPDATE_DEMO_MS);
});
$('pickBg').addEventListener('click', () => $('bgFile').click());
$('clearBg').addEventListener('click', () => { settings.background = null; applySettings(); });
$('bgFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const url = URL.createObjectURL(file);
  try {
    settings.background = { url, bright: (await measureBrightness(url)) > 0.55 };
    applySettings();
  } catch (error) {
    toast(error.message);
  }
});
document.addEventListener('mousedown', (e) => { if (openDd && !openDd.contains(e.target)) closeDropdown(); });

/* ---------- 右键菜单 ---------- */

function openContext(x, y, entries) {
  const menu = $('ctx');
  menu.replaceChildren();
  for (const entry of entries) {
    if (entry === '-') { menu.append(document.createElement('hr')); continue; }
    if (entry.heading) {
      const h = document.createElement('div');
      h.className = 'heading';
      h.textContent = entry.heading;
      menu.append(h);
      continue;
    }
    const b = document.createElement('button');
    b.setAttribute('role', 'menuitem');
    b.textContent = entry.label;
    if (entry.danger) b.className = 'danger';
    if (entry.indent) b.style.paddingLeft = `${10 + entry.indent * 12}px`;
    b.addEventListener('click', () => { closeContext(); entry.run(); });
    menu.append(b);
  }
  menu.classList.add('open');
  const rect = menu.getBoundingClientRect();
  menu.style.left = `${Math.min(x, innerWidth - rect.width - 8)}px`;
  menu.style.top = `${Math.min(y, innerHeight - rect.height - 8)}px`;
  menu.querySelector('button')?.focus();
}

function closeContext() { $('ctx').classList.remove('open'); }

// 分类树按层级展开成缩进列表，给「移到分类」用
function flatGroups(parent = null, depth = 0) {
  return childrenOf(parent).flatMap((g) => [{ group: g, depth }, ...flatGroups(g.id, depth + 1)]);
}

$('sidebar').addEventListener('contextmenu', (e) => {
  e.preventDefault();
  const item = e.target.closest('[data-key]');
  const key = item?.dataset.key ?? '';
  if (!key.startsWith('group:')) {
    openContext(e.clientX, e.clientY, [{ label: t('newGroup'), run: () => createGroup(null) }]);
    return;
  }
  const id = key.slice(6);
  const entries = [];
  if (depthOf(id) < MAX_DEPTH) entries.push({ label: t('newSub'), run: () => createGroup(id) });
  entries.push({ label: t('rename'), run: () => { renamingId = id; buildSidebar(); } }, '-',
    { label: t('deleteGroup'), danger: true, run: () => deleteGroup(id) });
  openContext(e.clientX, e.clientY, entries);
});

$('list').addEventListener('contextmenu', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  e.preventDefault();
  const task = tasks.find((x) => x.id === Number(row.dataset.id));
  const entries = [{ heading: t('moveTo') }, ...flatGroups().map(({ group, depth }) =>
    ({ label: group.name, indent: depth, run: () => moveToGroup(task, group.id) }))];
  if (task.group) entries.push('-', { label: t('noGroup'), run: () => moveToGroup(task, null) });
  entries.push('-', { label: t('removeTask'), danger: true, run: () => removeTask(task.id) });
  openContext(e.clientX, e.clientY, entries);
});

document.addEventListener('mousedown', (e) => { if (!$('ctx').contains(e.target)) closeContext(); });

/* ---------- 拖任务到分类 ---------- */

const TASK_MIME = 'application/x-rainkeep-task';

$('list').addEventListener('dragstart', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  e.dataTransfer.setData(TASK_MIME, row.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
});

const groupItemAt = (target) => target.closest?.('[data-key^="group:"]');

$('sidebar').addEventListener('dragover', (e) => {
  const item = groupItemAt(e.target);
  if (!item || !e.dataTransfer.types.includes(TASK_MIME)) return;
  e.preventDefault();
  e.stopPropagation();
  document.querySelectorAll('.drop-target').forEach((el) => el !== item && el.classList.remove('drop-target'));
  item.classList.add('drop-target');
});
$('sidebar').addEventListener('dragleave', (e) => groupItemAt(e.target)?.classList.remove('drop-target'));
$('sidebar').addEventListener('drop', (e) => {
  const item = groupItemAt(e.target);
  if (!item || !e.dataTransfer.types.includes(TASK_MIME)) return;
  e.preventDefault();
  e.stopPropagation();
  item.classList.remove('drop-target');
  const task = tasks.find((x) => x.id === Number(e.dataTransfer.getData(TASK_MIME)));
  if (task) moveToGroup(task, item.dataset.key.slice(6));
});

/* ---------- 状态栏面板 ---------- */

function openPanel() {
  const rect = $('mbItem').getBoundingClientRect();
  const panel = $('panel');
  panel.style.left = `${Math.max(8, Math.min(rect.left + rect.width / 2 - 160, innerWidth - 328))}px`;
  panel.classList.add('open');
  $('mbItem').setAttribute('aria-expanded', 'true');
  renderPanel();
}

function closePanel() {
  $('panel').classList.remove('open');
  $('mbItem').setAttribute('aria-expanded', 'false');
}

$('mbItem').addEventListener('click', () => ($('panel').classList.contains('open') ? closePanel() : openPanel()));
$('panelTabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || btn.dataset.tab === panelTab) return;
  panelTab = btn.dataset.tab;
  renderPanel();
});
$('panelList').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (btn) toggleTask(tasks.find((x) => x.id === Number(btn.closest('.p-row').dataset.id)));
});
$('panelOpen').addEventListener('click', closePanel);
$('panelQuit').addEventListener('click', () => toast(t('quitTip')));
document.addEventListener('mousedown', (e) => {
  if ($('panel').classList.contains('open') && !$('panel').contains(e.target) && !$('mbItem').contains(e.target)) closePanel();
});

/* ---------- 事件 ---------- */

$('sidebar').addEventListener('click', (e) => {
  const item = e.target.closest('[data-key]');
  if (!item || e.target.tagName === 'INPUT' || item.dataset.key === view.key) return;
  view.key = item.dataset.key;
  renderAll(true);
});
$('newGroupBtn').addEventListener('click', () => createGroup(null));

$('segmented').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || btn.dataset.status === view.status) return;
  view.status = btn.dataset.status;
  renderAll(true);
});

function removeTask(id) {
  tasks = tasks.filter((x) => x.id !== id);
  schedule();
  renderAll();
}

function toggleTask(task) {
  switch (task.status) {
    case 'downloading':
    case 'queued':   setStatus(task, 'paused'); break;
    case 'paused':
    case 'failed':   setStatus(task, 'queued'); break;
    default:         toast(savePath(task));
  }
}

$('list').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = Number(btn.closest('.row').dataset.id);
  if (btn.dataset.act === 'remove') removeTask(id);
  else toggleTask(tasks.find((x) => x.id === id));
});

$('pauseAll').addEventListener('click', () => {
  const running = tasks.some((x) => x.status === 'downloading' || x.status === 'queued');
  for (const task of tasks) {
    if (running && (task.status === 'downloading' || task.status === 'queued')) { task.status = 'paused'; task.speed = 0; }
    if (!running && task.status === 'paused') task.status = 'queued';
  }
  schedule();
  renderAll();
});

$('addBtn').addEventListener('click', openAdd);
$('confirmAdd').addEventListener('click', confirmAdd);
$('settingsBtn').addEventListener('click', openSettings);

document.addEventListener('keydown', (e) => {
  const cmd = e.metaKey || e.ctrlKey;
  if (e.key === 'Escape') {
    if ($('ctx').classList.contains('open')) closeContext();
    else if (openDd) { const btn = openDd.querySelector('.dd-btn'); closeDropdown(); btn.focus(); }
    else if ($('panel').classList.contains('open')) closePanel();
    else closeDialog();
    return;
  }
  if (openScrim?.id === 'addScrim' && e.key === 'Enter' && cmd) confirmAdd();
  if (openScrim) return;
  if (cmd && e.key.toLowerCase() === 'n') { e.preventDefault(); openAdd(); }
  if (cmd && e.key === ',') { e.preventDefault(); openSettings(); }
});

// 拖链接进窗口直接添加；任务行拖到侧栏的情况由侧栏自己处理
const win = $('window');
win.addEventListener('dragover', (e) => {
  if (e.dataTransfer.types.includes(TASK_MIME)) return;
  e.preventDefault();
  win.classList.add('dropping');
});
win.addEventListener('dragleave', (e) => { if (!win.contains(e.relatedTarget)) win.classList.remove('dropping'); });
win.addEventListener('drop', (e) => {
  if (e.dataTransfer.types.includes(TASK_MIME)) return;
  e.preventDefault();
  win.classList.remove('dropping');
  const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
  const urls = parseUrls(text);
  if (urls.length) addUrls(urls); else toast(t('noLinksDrop'));
});

window.addEventListener('resize', () => renderAll());

  makeTask('首页-v3.fig', 42 * MB, 42 * MB, 'completed', 'https://figma.example.com/首页-v3.fig', 'design'),

requestAnimationFrame(() => document.body.classList.add('ready'));   // 首次定位后再开滑块过渡，避免开场乱飞
